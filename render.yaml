services:
  - type: web
    name: sermon-notes-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 180 server:app
    healthCheckPath: /health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
